# This workflow builds, vets and tests the repository.
# It runs on pushes and pull requests to main and develop.
# Failures are mirrored into $GITHUB_STEP_SUMMARY so the error text
# is readable without signing in.

name: Go

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Verify formatting
      run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

    - name: Vet
      run: go vet ./...

    - name: Build
      run: |
        set -o pipefail
        if ! go build -v ./... 2>&1 | tee build.log; then
          echo "::error::go $(go version)"
          tail -8 build.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1
        fi

    - name: Test
      run: |
        set -o pipefail
        if ! go test -race -timeout 10m ./... 2>&1 | tee test.log; then
          {
            echo "### Test failed"
            echo '```'
            grep -E "^(--- FAIL|FAIL|panic|WARNING)" test.log | head -50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

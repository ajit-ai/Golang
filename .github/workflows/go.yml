# This workflow builds, vets and tests the repository.
# It runs on pushes and pull requests to main and develop.

name: Go

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Verify formatting
      run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -race -timeout 10m ./...
